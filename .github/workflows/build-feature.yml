# Workflow de estudio:
#   JOB 1 = CI del PR (compilar + tests).
#   JOB 2 = despues de que una persona haga review y pulse Merge.
#
# Importante: GitHub Actions NO puede "esperar al boton Merge" y luego mergear.
# Quien mergea es la persona (el boton). El Job 2 SOLO reacciona cuando el PR
# ya quedo fusionado. Para exigir review ANTES de ese boton, configura
# Branch protection en develop (Settings > Branches):
#   - Require a pull request before merging
#   - Require approvals
#   - Require status checks to pass (el check del JOB 1: build-feature)

# Nombre que veras en la pestana Actions de GitHub.
name: build and test feature branch

# "on" define QUE evento dispara el workflow.
on:
  pull_request:
    # Solo PRs cuya rama DESTINO sea develop (github.base_ref).
    branches: [ develop ]
    types:
      - opened        # acaba de crearse el PR  -> JOB 1
      - reopened      # se reabrio un PR cerrado -> JOB 1
      - synchronize   # nuevo commit en el PR    -> JOB 1
      - closed        # se cerro el PR (Merge o Close) -> JOB 2 si merged == true

jobs:
  #############################################################
  # JOB 1: descargar la feature, Java 17, compilar y tests.
  #        Corre en cada push al PR. NO corre cuando el PR se cierra.
  #############################################################
  build-feature:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # Clona el commit exacto de la rama origen del PR (la feature).
      # head.sha = el ultimo commit del PR, no el merge commit que GitHub inventa.
      - name: Pull and Checkout from feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Instala JDK 17 (el mismo del pom.xml: <java.version>17</java.version>).
      # cache: maven guarda ~/.m2 entre runs. NO hace falta actions/cache aparte.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # clean: borra target/. package: compila + tests + genera el JAR.
      # -B = batch mode (sin preguntas interactivas; obligatorio en CI).
      - name: Build with Maven
        run: mvn -B clean package

  #############################################################
  # JOB 2: se dispara SOLO cuando alguien pulso Merge y el PR
  #        quedo fusionado en develop. No hace git merge ni git push.
  #
  # No uses needs: build-feature aqui. El click en Merge es OTRO run
  # del workflow (evento closed). El Job 1 de este run esta skipped.
  #############################################################
  after-merge-to-develop:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El merge ya lo hizo GitHub. Bajamos el commit de merge en develop.
      - name: Checkout develop (codigo ya mergeado)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Aviso a otro workflow que escuche:
      #   on:
      #     repository_dispatch:
      #       types: [publish-artifact-event]
      # Ese workflow tiene que estar en la rama por defecto del repo.
      - name: Trigger publish artifact
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: publish-artifact-event
          client-payload: '{ "base_branch": "${{ github.base_ref }}" }'
