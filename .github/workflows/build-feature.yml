# Workflow de estudio: al abrir/actualizar un PR hacia develop,
# se compila, se corren tests y, si todo sale bien, se hace merge automatico.
#
# Este archivo vive en .github/workflows/ para que GitHub Actions lo detecte solo.

# Nombre que veras en la pestana Actions de GitHub.
name: build and test feature branch

# "on" define QUE evento dispara el workflow.
on:
  # pull_request = alguien abrio (o actualizo) un PR. No es lo mismo que "push".
  pull_request:
    # Solo PRs cuya rama DESTINO sea develop (github.base_ref).
    branches: [ develop ]
    types:
      - opened        # acaba de crearse el PR
      - reopened      # se reabrio un PR cerrado
      - synchronize   # synchronize: cada commit nuevo al PR. Sin esto, un fix despues de tests en rojo NO volveria a disparar el workflow.


# Un workflow tiene uno o mas jobs. Cada job corre en su propia maquina virtual.
jobs:
  #############################################################
  # JOB 1:    descargar el codigo de la feature, Java 17 y comprobar que el proyecto compila y que los tests unitarios pasan.
  #############################################################
  build-feature:
    runs-on: ubuntu-latest
    steps:
      # Clona el commit exacto de la rama origen del PR (la feature).
      # head.sha = el ultimo commit del PR, no el merge commit que GitHub inventa.
      # @v7 = version mayor de la action oficial; conviene fijarla.
      - name: Pull and Checkout from feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Instala JDK 17 (el mismo del pom.xml: <java.version>17</java.version>).
      # temurin = Eclipse Adoptium, muy usado en CI.
      # cache: maven guarda ~/.m2 entre runs. NO hace falta actions/cache aparte.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # clean: borra target/. package: compila + tests (surefire) + genera el JAR.
      # -B = batch mode (sin preguntas interactivas; obligatorio en CI).
      # No uses "mvn test package": package ya ejecuta los tests y los correriamos 2 veces.
      - name: Build with Maven
        run: mvn -B clean package

